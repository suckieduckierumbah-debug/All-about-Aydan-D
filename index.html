<!DOCTYPE html>
<html>
<head>
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #bait {
      text-align: center;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
    }
    #scare-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
    }
    #scare-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="bait">
    <h2>Verification Required</h2>
    <p>Click below to continue to the content.</p>
    <button onclick="triggerScare()">Continue</button>
  </div>

  <div id="scare-container">
    <img id="scare-img" src="scare1.jpg.webp" alt="">
  </div>

  <audio id="audio1" src="scream.mp3.mp3"></audio>
  <audio id="audio2" src="scream2.mp3.mp3" loop></audio>

  <script>
    const images = [
      'scare1.jpg.webp',
      'scare2.jpg.jpg',
      'scare3.jpg.png',
      'scare4.jpg.png',
      'scare5.jpg.png'
    ];
    
    let currentIndex = 0;

    function triggerScare() {
      document.getElementById('bait').style.display = 'none';
      document.getElementById('scare-container').style.display = 'block';
      
      const audio1 = document.getElementById('audio1');
      const audio2 = document.getElementById('audio2');
      
      audio1.volume = 1.0;
      audio2.volume = 1.0;

      // Start second audio when first audio ends
      audio1.addEventListener('ended', () => {
        audio2.play();
      });

      audio1.play();

      // Cycle through all 5 images every 80 milliseconds
      const imgElement = document.getElementById('scare-img');
      setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
      }, 80); 
    }
  </script>

</body>
</html>
